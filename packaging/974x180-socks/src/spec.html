<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Poppins';font-weight:500;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf)}
@font-face{font-family:'Poppins';font-weight:700;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1600px;height:1000px;background:#fff;font-family:Poppins,'Noto Sans CJK SC',sans-serif;position:relative;color:#000}
/* 1mm = 4.6px ; bag 230x130 => 1058x598 at left 240 top 170 */
.bag{position:absolute;left:240px;top:170px;width:1058px;height:598px;border:2px solid #555}
.zip{position:absolute;left:240px;top:170px;width:1058px;height:28px;border-bottom:1.5px dashed #888}
.pull{position:absolute;left:300px;top:150px;width:46px;height:24px;border:2px solid #555;background:#fff}
.art{position:absolute;left:240px;top:170px;width:1058px;height:598px}
.vent{position:absolute;left:300px;top:690px;width:26px;height:26px;border-radius:50%;border:2px solid #555}
.lab{position:absolute;font:600 22px Poppins,'Noto Sans CJK SC'}
.dim{position:absolute;background:#C0392B}
.t{position:absolute;font:700 24px Poppins;color:#C0392B}
.arrow{position:absolute;font:700 22px Poppins;color:#000}
h1{position:absolute;left:240px;top:40px;font:700 30px Poppins}
h2{position:absolute;left:240px;top:86px;font:500 18px Poppins;color:#555}
.note{position:absolute;left:240px;top:880px;font:500 18px/1.6 Poppins,'Noto Sans CJK SC';color:#333}
