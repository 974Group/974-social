.price{position:absolute;display:flex;align-items:center;gap:16px}
.price .b{background:#C9A24B;color:#15100F;border-radius:999px;padding:6px 30px 10px;display:flex;align-items:baseline;gap:8px}
.price .b b{font:800 60px Poppins;line-height:1}.price .b span{font:800 26px Cairo}

.foot{position:absolute;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center;font:600 22px Poppins;letter-spacing:.12em;color:#BFB3A8}
