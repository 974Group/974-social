<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(Poppins-Medium.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:var(--bg);--bg:#720842;--fg:#fff}
#wrap{position:absolute;left:0;top:0;width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center}
svg{width:640px;display:block;overflow:visible}
#sub{margin-top:54px;font:500 34px P;letter-spacing:.32em;color:var(--fg);padding-left:.32em;white-space:nowrap}
#sub span{display:inline-block;opacity:0}
</style></head><body><div id="wrap"><svg id="s"></svg><div id="sub"></div></div>
<script>
const PATHS={"w": 2910, "h": 1618, "d": [["M396,25 L344,44 L298,66 L241,101 L196,136 L154,176 L122,213 L93,253 L69,293 L43,347 L22,407 L9,463 L1,533 L1,593 L6,644 L13,683 L26,732 L44,781 L72,838 L105,890 L139,933 L183,978 L220,1009 L263,1039 L301,1061 L350,1084 L127,1616 L730,1616 L1031,905 L1098,739 L1112,689 L1120,647 L1126,578 L1125,526 L1117,461 L1103,402 L1083,346 L1058,294 L1028,245 L986,191 L946,150 L895,108 L851,79 L785,45 L730,25 L680,12 L623,3 L575,0 L514,2 L456,10 Z", "M530,431 L553,427 L574,427 L600,432 L618,439 L647,458 L669,482 L683,507 L690,529 L693,552 L691,579 L685,601 L675,622 L662,640 L647,655 L629,668 L599,681 L570,686 L546,685 L518,678 L499,669 L478,654 L465,641 L450,620 L438,591 L434,571 L434,542 L438,522 L450,493 L464,473 L479,458 L504,441 Z"], ["M961,39 L1005,75 L1059,130 L1105,189 L1142,249 L1172,312 L1194,374 L1211,445 L1219,510 L1423,511 L969,1616 L1571,1616 L2220,39 Z"], ["M2824,41 L1779,1261 L2358,1261 L2359,1616 L2908,1616 L2908,41 Z", "M2526,716 L2527,907 L2364,908 L2363,906 Z"]]};
let P,parts=[],fills=[];
const ease=t=>t<0?0:t>1?1:(t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2);
const cl=t=>Math.max(0,Math.min(1,t));
async function init(theme){
  if(theme==='light'){document.body.style.setProperty('--bg','#F4F1F2');document.body.style.setProperty('--fg','#720842');}
  P=PATHS;
  const s=document.getElementById('s');s.setAttribute('viewBox',`-40 -40 ${P.w+80} ${P.h+80}`);
  const NS='http://www.w3.org/2000/svg';
  P.d.forEach((ds,i)=>{
    const f=document.createElementNS(NS,'path');f.setAttribute('d',ds.join(' '));f.setAttribute('fill-rule','evenodd');
    f.style.fill='var(--fg)';f.style.opacity=0;s.appendChild(f);fills.push(f);
    parts[i]=ds.map(d=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);
      p.style.cssText='fill:none;stroke:var(--fg);stroke-width:24;stroke-linecap:round;stroke-linejoin:round';
      s.appendChild(p);const L=p.getTotalLength();p.style.strokeDasharray=L+' '+L;p.style.strokeDashoffset=L;p._L=L;return p;});
  });
  const sub=document.getElementById('sub');[...'974group.net'].forEach(c=>{const e=document.createElement('span');e.textContent=c;sub.appendChild(e)});
  document.fonts&&await document.fonts.ready;
}
// timeline (s)
const D=[[0.15,0.80],[0.50,1.05],[0.80,1.40]];
function render(t){
  D.forEach(([a,b],i)=>{
    const k=ease((t-a)/(b-a));
    parts[i].forEach(p=>{p.style.strokeDashoffset=p._L*(1-k);p.style.opacity=k>0?1:0});
    const f=cl((t-(b-0.12))/0.22); fills[i].style.opacity=f;
  });
  const sc=0.94+0.06*ease((t-0.15)/1.5);
  document.getElementById('s').style.transform=`scale(${sc})`;
  [...document.querySelectorAll('#sub span')].forEach((e,j)=>{const k=ease((t-1.45-j*0.045)/0.35);e.style.opacity=k;e.style.transform=`translateY(${(1-k)*18}px)`;});
}
</script></body></html>
