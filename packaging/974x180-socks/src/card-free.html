<!doctype html><html><head><meta charset="utf-8"><style>

.vt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font:700 7pt Poppins;letter-spacing:.25em}
.lock{position:absolute;left:0;right:0;top:17mm;display:flex;align-items:center;justify-content:center;gap:4.2mm}
.l974{display:flex;flex-direction:column;align-items:center}

.x{font:500 13pt Poppins;color:#161616}
.l180{width:22mm}
.tag{position:absolute;left:0;right:0;bottom:7.5mm;text-align:center;font:700 6.5pt Poppins;letter-spacing:.32em;padding-left:.32em}
.size{position:absolute;right:6mm;top:6mm;text-align:right;font:700 6.5pt/1.35 Poppins}
.care{position:absolute;left:7mm;right:7mm;top:7mm;text-align:center}

.icons{display:flex;justify-content:center;gap:2.6mm;margin-top:1.6mm}
.icons svg{width:4.2mm;height:4.2mm}
.made{font:600 4.6pt Poppins;letter-spacing:.15em;margin-top:1.2mm;color:#555}
.soc{position:absolute;left:7mm;bottom:6.5mm;font:600 6pt/1.6 Poppins}
.soc div{display:flex;align-items:center;gap:1.4mm}
.soc svg{width:3.2mm;height:3.2mm}
.mini{position:absolute;right:7mm;bottom:6mm;display:flex;align-items:center;gap:1.6mm}
.mini img{height:5mm}
