<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="assets/shared.css">
<style>
#logo{position:absolute;left:50%;top:260px;height:60px;translate:-50% 0}
#t1{top:430px;font-size:150px;line-height:1}
#t2{top:610px;font-size:52px;direction:rtl}
#s{left:50%;top:820px;width:520px;translate:-50% 0}
</style></head><body>
<img id="logo" src="assets/logo-black.png">
<div class="c lora" id="t1">Pilates Club</div>
<div class="c" id="t2">دلاغات بيلاتيس</div>
<img class="sock" id="s" src="assets/socks/cherrybow.png">
<script type="module">
import {prog,outBack,outCubic,fontsReady} from './assets/ease.js';
const $=id=>document.getElementById(id);
window.film={duration:2.6,ready:fontsReady(),frame(t){
  $('logo').style.opacity=1;
  const p1=prog(t,0,.5);$('t1').style.opacity=p1;$('t1').style.translate=`0 ${(1-outCubic(p1))*60}px`;$('t1').style.letterSpacing=`${(1-outCubic(p1))*20}px`;
  const p2=prog(t,.45,.85);$('t2').style.opacity=p2;
  const ps=prog(t,.7,1.3);$('s').style.opacity=ps>0?1:0;$('s').style.translate=`-50% ${(1-outBack(ps,1.6))*-900}px`;
  $('s').style.rotate=`${-8+ (t>1.3?Math.sin((t-1.3)*3)*2:0)}deg`;
}};
</script></body></html>
