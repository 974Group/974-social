<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Cairo';font-weight:400 900;src:url(../../aw/fonts/cairo-SLXVc1nY6HkvangtZmpQdkhzfH5lkSscQyyS8p4_RHH1.woff2)}
@font-face{font-family:'Cairo';font-weight:400 900;src:url(../../aw/fonts/cairo-SLXVc1nY6HkvangtZmpQdkhzfH5lkSscRiyS8p4_RA.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:'Poppins';font-weight:600;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Medium.ttf)}
@font-face{font-family:'Poppins';font-weight:800;src:url(file:///usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#EFE2CB}
#bg{position:absolute;inset:0;width:1080px;height:1920px;transform-origin:50% 50%}
.t{position:absolute;left:0;right:0;text-align:center;opacity:0}
#k{top:250px;font:600 26px Poppins;letter-spacing:.42em;color:#8A1C22;padding-left:.42em}
#h{top:290px;font:900 170px/1.1 Cairo;color:#1C1210;direction:rtl}
#h b{color:#B3202A}
#p{top:1490px}
#p span{display:inline-flex;align-items:baseline;gap:12px;background:#B3202A;color:#fff;border-radius:999px;padding:12px 44px 18px}
#p b{font:800 72px Poppins;line-height:1}#p i{font:700 34px Cairo;font-style:normal}
#m{top:1640px;font:700 34px Cairo;color:#3A2A24;direction:rtl}
#m .en{font:600 28px Poppins;direction:ltr;unicode-bidi:isolate;display:block;margin-top:4px;color:#5A463C}
</style></head><body>
<img id="bg" src="end_souq2.jpg">
<div class="t" id="k">AL SADU SERIES</div>
<div class="t" id="h">الس<b>دو</b></div>
<div class="t" id="p"><span><b>99</b><i>ر.ق</i></span></div>
<div class="t" id="m">4 نقشات · سير قماش<span class="en">Whoop 5.0 &amp; MG</span></div>
<script>
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
function render(t){
  document.getElementById('bg').style.transform=`scale(${1+0.03*t/3})`;
  [['k',0.15],['h',0.3],['p',0.75],['m',0.95]].forEach(([id,s])=>{const k=ease((t-s)/0.5);const e=document.getElementById(id);e.style.opacity=k;e.style.transform=`translateY(${(1-k)*30}px)`;});
}
render(0);
</script></body></html>
