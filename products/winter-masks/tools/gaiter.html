<script type="module">

// ---- worn gaiter surface: theta around, t bottom(0)->top(1); front faces +z ----
const NT = 260, NY = 220, HGT = 2.15;

    rz += 0.36 * Math.pow(f, 14) * Math.exp(-Math.pow((t - 0.86) / 0.09, 2)); // nose ridge
